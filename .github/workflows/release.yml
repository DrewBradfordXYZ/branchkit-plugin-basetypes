name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            arch_label: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            arch_label: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # Derive plugin name from repo: branchkit-plugin-{name} → {name}
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          PLUGIN_NAME="${REPO_NAME#branchkit-plugin-}"

          go build -ldflags="-s -w" -o "${PLUGIN_NAME}-plugin" .

      - name: Package
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          PLUGIN_NAME="${REPO_NAME#branchkit-plugin-}"
          ARCHIVE="${REPO_NAME}-${{ matrix.goos }}-${{ matrix.arch_label }}.tar.gz"

          tar czf "$ARCHIVE" plugin.json "${PLUGIN_NAME}-plugin"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.arch_label }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
